<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具架原型 v2 · 4轴分类</title>
<style>
  :root{
    --blue:#002FA7; --blue-soft:#E8EEFF;
    --access:#0B6BCB; --access-soft:#E7F1FC;
    --loc:#7C3AED; --loc-soft:#F1EBFF;
    --owner:#0B7A4B; --owner-soft:#E6F6EE;
    --fn:#002FA7; --fn-soft:#E8EEFF;
    --text:#1A1F2E; --muted:#6B7280; --line:#E5E7EB;
    --bg:#F6F7F9; --card:#FFFFFF;
    --green:#16A34A; --red:#DC2626; --amber:#D97706; --gray:#9CA3AF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  a{text-decoration:none;color:inherit}

  /* 原型横幅 */
  .proto-banner{background:#002FA7;color:#fff;padding:8px 24px;font-size:13px;display:flex;gap:16px;align-items:center}
  .proto-banner b{background:#fff;color:#002FA7;padding:1px 8px;border-radius:4px;font-size:12px}
  .proto-banner .note{opacity:.85}

  .header{padding:16px 24px 8px;display:flex;justify-content:space-between;align-items:flex-end}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
  .brand-name{font-size:18px;font-weight:700}
  .brand-sub{font-size:12px;color:var(--muted)}
  .proto-tag{font-size:12px;color:var(--blue);border:1px solid var(--blue);padding:2px 8px;border-radius:12px;background:#fff}
  .philo{font-size:12px;color:var(--muted)}

  .toolbar{padding:8px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .stats-row{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px}
  .stat-card{cursor:pointer;padding:4px 8px;border-radius:8px;font-size:13px}
  .stat-card.active{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .stat-num{font-weight:700;margin-right:2px}
  .stat-sep{color:var(--line)}
  .search-input{flex:1;min-width:160px;max-width:320px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none}
  .search-input:focus{border-color:var(--blue)}

  /* 4轴筛选栏 */
  .filter-bar{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 24px;display:flex;flex-direction:column;gap:6px}
  .filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .filter-dim{font-size:12px;font-weight:600;color:var(--muted);width:64px;flex-shrink:0}
  .filter-pill{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 10px;font-size:12px;color:var(--text);display:inline-flex;gap:6px;align-items:center}
  .filter-pill.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .pill-cnt{font-size:11px;opacity:.6;font-weight:600}
  .dim-note{font-size:11px;color:var(--muted)}

  .content{padding:20px 24px;max-width:1880px;margin:0 auto}
  .tool-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
  @media(max-width:1700px){.tool-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:1300px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:900px){.tool-grid{grid-template-columns:repeat(2,1fr)}}

  .tool-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s,transform .15s;min-width:0}
  .tool-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-1px)}
  .tool-card.s-on{border-color:#d1fae5}
  .tool-card.s-start_failed,.tool-card.s-broken,.tool-card.s-incomplete,.tool-card.s-orphan,.tool-card.s-stale_path{border-color:#fecaca}

  /* P0 身份 */
  .p0{display:flex;gap:10px;align-items:center}
  .card-mono{width:40px;height:40px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
  .card-info{min-width:0}
  .card-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .card-name .chev{margin-left:auto;font-size:11px;color:var(--muted);cursor:pointer}
  .auto-badge{font-size:10px;background:#FFF4E5;color:var(--amber);padding:0 5px;border-radius:4px}
  .card-id{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* P1 状态 + meta */
  .p1{display:flex;justify-content:space-between;align-items:center}
  .status-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:5px}
  .status-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .s-on{background:#d1fae5;color:var(--green)}
  .s-off{background:#f3f4f6;color:var(--muted)}
  .s-start_failed,.s-broken,.s-incomplete,.s-orphan,.s-stale_path{background:#fee2e2;color:var(--red)}
  .s-starting,.s-halting{background:#FEF3C7;color:var(--amber)}
  .s-disabled{background:#f3f4f6;color:#9ca3af}
  .card-meta{font-size:11px;color:var(--muted);font-family:Consolas,monospace}

  /* P2 4轴标签 */
  .p2{display:flex;flex-wrap:wrap;gap:5px}
  .b{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:500;white-space:nowrap}
  .b-fn{background:var(--fn-soft);color:var(--fn)}
  .b-access{background:var(--access-soft);color:var(--access)}
  .b-loc{background:var(--loc-soft);color:var(--loc)}
  .b-owner{background:var(--owner-soft);color:var(--owner)}
  .b-rt{background:#f3f4f6;color:var(--muted);font-family:Consolas,monospace}

  /* P3 描述 */
  .p3{font-size:12px;color:var(--text);line-height:1.5;min-height:36px}
  .card-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-placeholder{color:var(--gray)}

  /* P4 动作 */
  .p4{display:flex;gap:6px;align-items:center;margin-top:auto;flex-wrap:wrap}
  .btn{font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
  .btn.go{background:var(--green);border-color:var(--green);color:#fff}
  .btn.stop{background:#fff;border-color:#fecaca;color:var(--red)}
  .btn.open{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.fix{background:#FEF3C7;border-color:#FDE68A;color:var(--amber)}
  .p4-spacer{flex:1}
  .toggle{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer}

  /* 底部分类分布 */
  .dist{padding:16px 24px 32px;max-width:1880px;margin:0 auto}
  .dist h3{font-size:13px;color:var(--muted);margin-bottom:10px}
  .dist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .dist-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  .dist-title{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--muted)}
  .dist-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .dist-row .n{font-weight:600}

  .empty{padding:60px;text-align:center;color:var(--muted);font-size:14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1f2e;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="proto-banner">
  <b>原型 v2</b><span class="note">4轴分类 · 真实 /api/tools 数据驱动 · 操作按钮仅示意（不会真启停工具）</span>
</div>

<div class="header">
  <div class="brand">
    <div class="logo">工</div>
    <div>
      <div class="brand-name">工具架 <span class="proto-tag">卡片 + 分类重构原型</span></div>
      <div class="brand-sub">Agentboard · 一个文件一个工具 · 同一份真相，两个平面</div>
    </div>
  </div>
  <div class="philo">MECE：功能分类 × 接入方式 × 运行位置 × 归属 —— 四轴正交</div>
</div>

<div class="toolbar">
  <div class="stats-row" id="statsRow"></div>
  <input class="search-input" placeholder="搜索工具…" id="searchInput" oninput="render()">
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="content">
  <div class="tool-grid" id="toolGrid"></div>
</div>

<div class="dist">
  <h3>四轴分布（实时验证 MECE —— 数字来自真实数据）</h3>
  <div class="dist-grid" id="distGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── 4轴分类（与 _runtime/classify.js 同逻辑，验证过的） ───
var OVERRIDE = {
  'agnes-ai':['API','远程'], 'omniroute':['API','本地'], 'tencent-cloud-api':['API','远程'],
  'figma-mcp':['API','远程'], 'claude-code':['CLI','本地'], 'codex-cli':['CLI','本地'],
  'hermes':['CLI','本地'], 'pasteex':['CLI','本地'], 'mcp-chrome':['API','本地']
};
function classifyFn(cat){ if(cat==='本地模型'||cat==='远程模型')return '模型'; if(cat==='工作区')return '职能'; return cat; }
function classifyAccess(t){ if(OVERRIDE[t.id])return OVERRIDE[t.id][0]; if(t.type==='cli'||t.type==='command')return 'CLI'; if(t.apiBase)return 'API'; return 'Web'; }
function classifyLoc(t){ if(OVERRIDE[t.id])return OVERRIDE[t.id][1]; if(t.type==='cli'||t.type==='command')return '本地'; if((t.ports&&t.ports.length)||t.port||t.startCommand||t.stopCommand)return '本地'; return '远程'; }
function classifyOwner(t){ return (t.owner==='AI托管'||!t.owner)?'外部':t.owner; }

// ─── 状态 ───
var STATE_META = {
  running:{label:'运行中',chip:'on'}, stopped:{label:'已停止',chip:'off'},
  start_failed:{label:'启动失败',chip:'start_failed'}, starting:{label:'启动中',chip:'starting'},
  halting:{label:'停止中',chip:'halting'}, broken:{label:'配置损坏',chip:'broken'},
  incomplete:{label:'字段不全',chip:'incomplete'}, orphan:{label:'未注册',chip:'orphan'},
  stale_path:{label:'路径失效',chip:'stale_path'}, disabled:{label:'已停用',chip:'disabled'}
};
function stateOf(t){ if(t.disabled)return 'disabled'; return t.state || (t.running?'running':'stopped'); }

// ─── 筛选状态 ───
var fnF='all', accF='all', locF='all', ownF='all', statusF='all';
var DIMS = {
  fn:   {label:'功能分类', values:['模型','Agent','设施','获取','查阅','创作','职能','公开站']},
  acc:  {label:'接入方式', values:['Web','CLI','API']},
  loc:  {label:'运行位置', values:['本地','远程']},
  own:  {label:'归属',     values:['自建','外部']}
};

var tools=[], indexed={};
async function load(){
  try{
    var r=await fetch('/api/tools'); var d=await r.json();
    tools=(d.tools||[]).map(function(t){
      t._fn=classifyFn(t.category); t._acc=classifyAccess(t); t._loc=classifyLoc(t); t._own=classifyOwner(t); t._state=stateOf(t);
      return t;
    });
    indexed={}; tools.forEach(function(t){indexed[t.id]=t});
    buildBar(); buildStats(); render();
  }catch(e){ grid.innerHTML='<div class="empty">加载失败：'+e.message+'（确认 localhost:3099 在跑）</div>'; }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
function mono(name){ var s=(name||'').trim(); var en=s.match(/[A-Za-z][A-Za-z\s]+/); if(en){var w=en[0].split(/\s+/).filter(Boolean);if(w.length>=2)return (w[0][0]+w[w.length-1][0]).toUpperCase();if(w.length===1&&w[0].length>=2)return w[0].substring(0,2).toUpperCase();} var cn=s.replace(/[^一-鿿]/g,''); if(cn.length>=2)return cn[0]+cn[cn.length-1]; var a=s.replace(/[^A-Za-z0-9]/g,''); if(a.length>=2)return a.substring(0,2).toUpperCase(); return (s.substring(0,2)||'??').toUpperCase(); }

// ─── 构建筛选栏 ───
function pill(key,val,count,active){
  var dim=DIMS[key];
  return '<button class="filter-pill'+(active?' active':'')+'" onclick="setF(\''+key+'\',\''+val+'\')" title="'+dim.label+' — '+val+'">'+val+'<span class="pill-cnt">'+count+'</span></button>';
}
function buildBar(){
  var html='';
  Object.keys(DIMS).forEach(function(key){
    var dim=DIMS[key];
    html+='<div class="filter-row"><span class="filter-dim">'+dim.label+'</span>';
    dim.values.forEach(function(v){
      var c=tools.filter(function(t){return t['_'+key]===v}).length;
      var act=(key==='fn'&&fnF===v)||(key==='acc'&&accF===v)||(key==='loc'&&locF===v)||(key==='own'&&ownF===v);
      html+=pill(key,v,c,act);
    });
    html+='</div>';
  });
  document.getElementById('filterBar').innerHTML=html;
}
function setF(key,val){
  var cur=(key==='fn'?fnF:key==='acc'?accF:key==='loc'?locF:ownF);
  if(key==='fn')fnF=(fnF===val?'all':val); if(key==='acc')accF=(accF===val?'all':val);
  if(key==='loc')locF=(locF===val?'all':val); if(key==='own')ownF=(ownF===val?'all':val);
  buildBar(); render();
}

// ─── 状态统计行 ───
function buildStats(){
  var open=tools.filter(function(t){return t.running}).length;
  var openable=tools.filter(function(t){return t.url&&(t.running||!(t.ports&&t.ports.length||t.port||t.startCommand))}).length;
  var stopped=tools.filter(function(t){return !t.running&&!t.disabled}).length;
  var pub=tools.filter(function(t){return t.publicUrl}).length;
  var items=[
    ['all','全部',tools.length],['running','运行中',open],['openable','可打开',openable],
    ['stopped','未启动',stopped],['public','公开站',pub]
  ];
  document.getElementById('statsRow').innerHTML=items.map(function(it,i){
    var act=statusF===it[0];
    var html='<div class="stat-card'+(act?' active':'')+'" onclick="setStatus(\''+it[0]+'\')"><span class="stat-num">'+it[2]+'</span>'+it[1]+'</div>';
    return (i===0?html:'<span class="stat-sep">·</span>'+html);
  }).join('');
}
function setStatus(v){ statusF=(statusF===v?'all':v); buildStats(); render(); }

// ─── 卡片渲染 ───
function p2Html(t){
  var o='';
  o+='<span class="b b-fn" title="功能分类">'+esc(t._fn)+'</span>';
  o+='<span class="b b-access" title="接入方式">'+esc(t._acc)+'</span>';
  o+='<span class="b b-loc" title="运行位置">'+esc(t._loc)+'</span>';
  o+='<span class="b b-owner" title="归属">'+esc(t._own)+'</span>';
  if(t.runtime&&t.runtime.language){ var lm={python:'py',node:'node',go:'go',rust:'rs',cpp:'c++',csharp:'c#',shell:'sh',other:'···'}; o+='<span class="b b-rt">'+(lm[t.runtime.language]||t.runtime.language)+(t.runtime.version?' '+t.runtime.version:'')+'</span>'; }
  return '<div class="p2">'+o+'</div>';
}
function p1Meta(t){
  if(t.type==='group')return '命令组';
  var st=t._state;
  if(st==='broken'||st==='incomplete'||st==='orphan'||st==='stale_path'||st==='start_failed'||st==='disabled') return t.stateDetail?esc(t.stateDetail):'';
  if(t.type==='folder')return '文件夹';
  if(t.type==='cli'&&t.trigger)return '<span>/'+esc(t.trigger)+'</span>';
  var ports=t.ports||(t.port?[t.port]:[]);
  return ports.length?(':'+ports.join(' :')):'';
}
function actions(t){
  var st=t._state; var b=[];
  var hasCmd=t.startCommand||t.stopCommand;
  if(st==='running')b.push('<button class="btn stop" onclick="toast(\'原型：停止示意\')">停止</button>');
  if(st==='stopped'&&hasCmd)b.push('<button class="btn go" onclick="toast(\'原型：启动示意\')">启动</button>');
  if(t.url&&(t.running||!(t.ports&&t.ports.length||t.port||t.startCommand)))b.push('<a class="btn open" href="'+esc(t.url)+'" target="_blank" onclick="event.stopPropagation()">打开</a>');
  b.push('<button class="btn" onclick="toast(\'原型：编辑示意\')">编辑</button>');
  if(t.publicUrl)b.push('<a class="btn" style="background:#FFF4E5;border-color:#FDE68A;color:#B45309" href="'+esc(t.publicUrl)+'" target="_blank" onclick="event.stopPropagation()">公开站</a>');
  return b.join('')+'<span class="p4-spacer"></span><span class="toggle" onclick="toast(\'原型：启停示意\')">'+(t.disabled?'停用':'启用')+'</span>';
}
function card(t){
  var st=t._state, meta=STATE_META[st]||STATE_META.stopped;
  return '<div class="tool-card s-'+meta.chip+'">'
    +'<div class="p0"><div class="card-mono">'+esc(t.icon||mono(t.name||t.id))+'</div><div class="card-info">'
    +'<div class="card-name">'+esc(t.name||t.id)+(t.autoStart?'<span class="auto-badge">常驻</span>':'')+'<span class="chev" onclick="toast(\'原型：展开详情示意\')">▾</span></div>'
    +'<div class="card-id">'+esc(t.id)+'</div></div></div>'
    +'<div class="p1"><span class="status-chip s-'+meta.chip+'">'+meta.label+'</span><span class="card-meta">'+p1Meta(t)+'</span></div>'
    +p2Html(t)
    +'<div class="p3">'+(t.description?'<div class="card-desc" title="'+esc(t.description)+'">'+esc(t.description)+'</div>':'<span class="card-placeholder">—</span>')+'</div>'
    +'<div class="p4">'+actions(t)+'</div>'
    +'</div>';
}
function filtered(){
  var q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  return tools.filter(function(t){
    if(fnF!=='all'&&t._fn!==fnF)return false;
    if(accF!=='all'&&t._acc!==accF)return false;
    if(locF!=='all'&&t._loc!==locF)return false;
    if(ownF!=='all'&&t._own!==ownF)return false;
    if(statusF==='running'&&!t.running)return false;
    if(statusF==='openable'&&!(t.url&&(t.running||!(t.ports&&t.ports.length||t.port||t.startCommand))))return false;
    if(statusF==='stopped'&&(t.running||t.disabled))return false;
    if(statusF==='public'&&!t.publicUrl)return false;
    if(q&&(t.name+' '+t.id+' '+t.description+' '+t._fn+' '+t._acc+' '+t._loc+' '+t._own).toLowerCase().indexOf(q)===-1)return false;
    return true;
  });
}
function render(){
  var list=filtered();
  document.getElementById('toolGrid').innerHTML=list.length
    ?list.map(card).join('')
    :'<div class="empty">没有匹配的工具</div>';
  renderDist();
}
function renderDist(){
  var html='';
  Object.keys(DIMS).forEach(function(key){
    var dim=DIMS[key];
    var rows=dim.values.map(function(v){
      var c=tools.filter(function(t){return t['_'+key]===v}).length;
      return '<div class="dist-row"><span>'+v+'</span><span class="n">'+c+'</span></div>';
    }).join('');
    html+='<div class="dist-box"><div class="dist-title">'+dim.label+' <span style="opacity:.5">合计 '+tools.length+'</span></div>'+rows+'</div>';
  });
  document.getElementById('distGrid').innerHTML=html;
}
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show')},1600); }

load();
</script>
</body>
</html>
