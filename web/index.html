<!--
AI AGENT REFERENCE — 工具架 Agentboard
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
API:     GET /api/tools     → 全部工具清单 JSON {ok, tools:[{id,name,description,category,port,ports,url,running,state,stateDetail,recovery,missingFields,startCommand,stopCommand,apiBase,projectPath,icon,version,order}]}
API:     GET /api/apps      → 公网应用注册表 JSON {ok, apps:[...]}（apps-registry.json）
API:     GET /api/tips      → 经验日志 JSON {ok, tips:[{file,title,desc,type}]}（tips/*.md）
API:     GET /api/registry  → 系统规范 JSON {ok, principles:[...]}（principles/*.md）
ACTION:  POST /api/tools/start/:id   POST /api/tools/stop/:id
PAGES:   #page-tools(工具架)  #page-apps(我的网站)  #page-tips(经验日志)  #page-docs(说明书 iframe /manual)  #page-registry(系统规范)
DIMS:    #dimBlocks 四维异色筛选块(category/form/owner/state) → setDimFilter(dim,val)
RULES:   localhost 用 Bash curl 不用 WebFetch。能力不够先查本地工具。启动/停止后等 500ms poll /api/tools。
━═ 你可以访问以下本地能力 ═━
视觉: MiniCPM-V :8080 (OpenAI兼容 /v1/chat/completions)
图像: ComfyUI :8188 | Stable Diffusion :7860
音乐: ACE Step :5173
RAG:  LangGraph Agent :8767 | LangGraph RAG :8766
语音: VoiceLite 中文版 | CosyVoice3 :8000
OCR:  Tesseract OCR (pytesseract)
模型: Ollama :11434 | DeepSeek API | GLM-4.6V Flash | Agnes AI
─━ 用 curl localhost:3099/api/tools 查完整清单 ━─
-->

<!-- S5 工具表单弹窗 v3（新建/编辑/补全/迁移/修复/注册 一套；双栏：表单 + 实时 manifest 预览） -->
<div class="modal-overlay" id="toolFormModal" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="tfTitle">编辑工具</span>
      <span class="modal-sub" id="tfSub"></span>
      <span class="modal-spacer"></span>
      <span class="mode-toggle">
        <button class="mode-btn" id="mb-edit" onclick="setMode('edit')">编辑已有</button>
        <button class="mode-btn" id="mb-new" onclick="setMode('new')">新建工具</button>
      </span>
      <button class="modal-close" onclick="closeToolForm()" title="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-form-wrap">
        <div class="form-pane">

          <div class="sec">
            <div class="sec-h"><span class="sec-num">1</span><span class="sec-title" title="ID 决定 tools/ 目录名">身份</span></div>
            <div class="row3">
              <div class="field"><label for="f-name">名字 <span class="req">*</span></label><input type="text" id="f-name" placeholder="例：MiniCPM-V 4.6"></div>
              <div class="field"><label for="f-id">ID <span class="req" id="id-req" style="display:none">*</span></label>
                <input type="text" id="f-id" placeholder="例：minicpm-v" style="display:none">
                <div class="auto-val" id="id-val" title="编辑已有：ID 锁定 = 当前目录名。改名 = 挪目录，需谨慎。">—</div>
              </div>
              <div class="field"><label>版本</label><div class="auto-val" id="f-version" title="自动读取自 manifest 的 version">—</div></div>
            </div>
            <div class="field"><label>图标</label>
              <div class="icon-row">
                <input type="text" id="f-icon" placeholder="emoji，空 = 用名字首字">
                <button type="button" class="btn" onclick="toggleIconPanel()">从库选</button>
                <button type="button" class="btn" onclick="clearIcon()">清空</button>
              </div>
              <div id="icon-panel" style="display:none"></div>
            </div>
          </div>

          <div class="sec">
            <div class="sec-h"><span class="sec-num">2</span><span class="sec-title" title="这工具干嘛">功能</span></div>
            <div class="field"><label for="f-func">功能一句话 <span class="req">*</span><span class="sec-hint" style="margin-left:6px;font-weight:400">capability，≤30 字</span></label><textarea id="f-func" placeholder="例：本地视觉模型，理解图片内容（OCR / 描述 / 问答）。"></textarea></div>
            <div class="field"><label for="f-ret">返回（描述尾部，自动拼 【返回】）</label><input type="text" id="f-ret" placeholder="例：Web UI :8080 / JSON"></div>
            <textarea id="f-extra" style="display:none" aria-hidden="true"></textarea>
          </div>

          <div class="sec">
            <div class="sec-h"><span class="sec-num">3</span><span class="sec-title" title="选完自动建议类型，可改">分类</span></div>
            <div class="row3">
              <div class="field"><label for="f-category">分类 <span class="req">*</span></label><select id="f-category" onchange="suggestType()"></select></div>
              <div class="field"><label for="f-owner">归属 <span class="req">*</span></label><select id="f-owner"></select></div>
              <div class="field"><label for="f-form" title="服务=常驻后台；命令=用完就走；API=外部服务；文件夹=项目目录；组=多工具编排">类型 <span class="req">*</span></label><select id="f-form" onchange="applyFormType()"></select></div>
            </div>
          </div>

          <div class="sec">
            <div class="sec-h"><span class="sec-num">4</span><span class="sec-title" title="只显示当前类型该填的">调用方式</span><span class="sec-hint">类型驱动</span></div>

            <div class="cg" id="cg-service">
              <div class="row3">
                <div class="field"><label for="f-port">端口</label><input type="text" id="f-port" placeholder="例：8080"></div>
                <div class="field"><label for="f-url">页面 URL</label><input type="text" id="f-url" placeholder="例：http://localhost:8080"></div>
                <div class="field"><label for="f-api">API 地址</label><input type="text" id="f-api" placeholder="例：…/v1/chat/completions"></div>
              </div>
              <div class="row2">
                <div class="field"><label for="f-start">启动命令 <span class="req">*</span></label><input type="text" id="f-start" placeholder="例：node server.js"></div>
                <div class="field"><label for="f-stop">停止命令</label><input type="text" id="f-stop" placeholder="例：node stop.js"></div>
              </div>
              <div class="field"><label for="f-path" title="进程工作目录">项目路径</label><input type="text" id="f-path" placeholder="例：D:\tools\minicpm-v"></div>
            </div>

            <div class="cg" id="cg-cli">
              <div class="row2">
                <div class="field"><label for="f-trigger">触发词 <span class="req">*</span></label><input type="text" id="f-trigger" placeholder="例：/clip"></div>
                <div class="field"><label for="f-start-cli">启动命令</label><input type="text" id="f-start-cli" placeholder="例：node run.js"></div>
              </div>
              <div class="field"><label for="f-path-cli" title="命令所在目录">项目路径</label><input type="text" id="f-path-cli" placeholder="例：D:\tools\some-cli"></div>
            </div>

            <div class="cg" id="cg-api">
              <div class="row3">
                <div class="field"><label for="f-api-api">API 地址 <span class="req">*</span></label><input type="text" id="f-api-api" placeholder="例：https://api.openai.com/v1/chat/completions"></div>
                <div class="field"><label for="f-keyname">密钥名</label><input type="text" id="f-keyname" placeholder="例：OPENAI_API_KEY"></div>
                <div class="field"><label for="f-url-api">文档 URL</label><input type="text" id="f-url-api" placeholder="例：https://platform.openai.com/docs"></div>
              </div>
            </div>

            <div class="cg" id="cg-folder">
              <div class="field"><label for="f-path-folder" title="文件夹没有端口没有命令，项目路径就是它">项目路径 <span class="req">*</span></label><input type="text" id="f-path-folder" placeholder="例：D:\workspace\gallery"></div>
            </div>

            <div class="cg" id="cg-group">
              <div class="field"><label for="f-children" title="组 = 多个工具的编排。每行一个子工具，格式：名字 —— 触发词">子工具 <span class="req">*</span></label><textarea id="f-children" placeholder="📖 认知深读日报 —— cron-认知深读&#10;📡 AI信号日报 —— cron-AI信号" style="min-height:60px"></textarea></div>
            </div>
          </div>

          <div class="sec">
            <div class="sec-h"><span class="sec-num">5</span><span class="sec-title" title="AI 决定用它不用的依据">何时调用</span></div>
            <div class="row2">
              <div class="field"><label for="f-when">何时用</label><textarea id="f-when" placeholder="例：需要理解图片内容（看图说话 / OCR / 图片问答）时。"></textarea></div>
              <div class="field"><label for="f-whennot">何时不用</label><textarea id="f-whennot" placeholder="例：生成图片 → 用 ComfyUI。语音 → cosyvoice3。"></textarea></div>
            </div>
          </div>

          <div class="sec">
            <div class="sec-h"><span class="sec-num">6</span><span class="sec-title">运维</span></div>
            <div class="cg" id="ops-path">
              <div class="field"><label for="f-runtime">运行时语言</label><select id="f-runtime"></select></div>
            </div>
            <div class="cg" id="ops-none"><div class="cg-note">API / 组 无本地进程：没有项目路径、没有运行时。</div></div>
            <div class="field" style="margin-top:12px"><label for="f-notes">Agent 操作笔记</label><textarea id="f-notes" placeholder="例：截图任务会误判端口；启动前先看 conflicts。" style="min-height:44px"></textarea></div>
            <div class="field"><label for="f-conflicts">冲突工具（逗号分隔）</label><input type="text" id="f-conflicts" placeholder="例：comfyui,stable-diffusion（GPU 显存互斥）。留空 = 无冲突，不写入"></div>
            <div class="check-row" id="autoStart-field"><input type="checkbox" id="f-autostart"><span title="服务类型：开机自动启动。停用时此项隐藏">开机自动启动</span></div>
            <label class="check-row" id="disabled-row" for="f-disabled"><input type="checkbox" id="f-disabled" onchange="applyFormType()"><span title="勾上后 AI 不可调用，同时强制取消开机自启">停用（AI 不可调用）</span></label>
          </div>

          <div class="form-actions">
            <button class="btn del" id="tfDelete" style="display:none" onclick="confirmDeleteForm()">删除工具</button>
            <button class="btn" onclick="closeToolForm()">取消</button>
            <button class="btn go" onclick="submitToolForm()">保存</button>
            <span class="hint" id="tfHint"></span>
          </div>

        </div>
        <div class="preview-pane">
          <div class="preview-h"><span class="dot"></span><span>实时预览 —— 保存时写入的 manifest.json</span></div>
          <div id="json-out"></div>
          <div class="hint-row" id="hint-row"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- S5 启动失败日志弹窗（查看日志按钮） -->
<div class="modal-overlay" id="logModal" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="logTitle">启动失败日志</span>
      <button class="modal-close" onclick="closeLogModal()" title="关闭">×</button>
    </div>
    <div class="modal-body">
      <pre id="logBody" style="white-space:pre-wrap;font-family:monospace;font-size:12px;line-height:1.6;margin:0;color:var(--text)"></pre>
    </div>
    <div class="modal-footer">
      <span class="tf-hint" id="logHint"></span>
      <span class="modal-spacer"></span>
      <button class="btn" onclick="closeLogModal()">关闭</button>
    </div>
  </div>
</div>

<script src="/_script.js"></script>
